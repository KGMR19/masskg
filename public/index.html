<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Private Messenger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0f172a;
    --bg-panel: #1e293b;
    --bg-hover: #334155;
    --bg-input: #0f172a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-light: #60a5fa;
    --border-color: #334155;
    --danger: #ef4444;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-base); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; }
  .hidden { display: none !important; }

  /* ---------- АВТОРИЗАЦИЯ ---------- */
  #auth { max-width: 380px; margin: 10vh auto; padding: 32px; background: var(--bg-panel); border-radius: 20px; border: 1px solid var(--border-color); }
  #auth h1 { font-size: 24px; margin-bottom: 24px; text-align: center; }
  #auth input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; }
  #auth input:focus { border-color: var(--accent); }
  #auth button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; font-size: 15px; }
  #auth #reg { background: transparent; border: 1px solid var(--border-color); margin-top: 12px; }
  #err { color: #f87171; font-size: 14px; text-align: center; margin-top: 16px; min-height: 20px; }

  /* ---------- ОСНОВНОЙ ИНТЕРФЕЙС ---------- */
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; width: 100vw; }
  aside { background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
  aside header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
  
  .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px; border-radius: 12px; }
  .user-profile:hover { background: var(--bg-hover); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 16px; color: white; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info b { font-size: 15px; display: block; }
  .user-info span { font-size: 12px; color: var(--success); }
  
  .header-actions { display: flex; gap: 4px; }
  .header-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .header-actions button:hover { background: var(--bg-hover); color: var(--text-main); }
  #addBtn { color: var(--accent-light); }

  .users-container { flex: 1; overflow-y: auto; }
  #users { list-style: none; padding: 12px; }
  #users li { padding: 8px 12px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #users li:hover { background: var(--bg-hover); }
  #users li.active { background: var(--accent); color: white; }
  .contact-left { display: flex; align-items: center; gap: 12px; }
  .contact-left .avatar { width: 36px; height: 36px; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; border: 2px solid var(--bg-panel); }
  .dot.on { background: var(--success); }
  #empty-contacts { display: none; flex-direction: column; align-items: center; padding: 20px; text-align: center; color: var(--text-muted); }

  /* ---------- ЧАТ ---------- */
  main { display: flex; flex-direction: column; height: 100%; background: var(--bg-base); }
  #empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
  main header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); }
  .chat-info { display: flex; align-items: center; gap: 12px; }
  .chat-info .title { font-weight: 600; font-size: 16px; }
  
  #typing-indicator { font-size: 12px; color: var(--accent-light); height: 16px; margin-top: 2px; font-style: italic; opacity: 0; transition: opacity 0.2s; }
  #typing-indicator.visible { opacity: 1; }

  /* ИСПРАВЛЕННЫЕ ИКОНКИ ЗВОНКОВ */
  .call-actions { display: flex; gap: 8px; align-items: center; }
  .call-actions button { 
    background: var(--bg-hover); border: none; color: var(--text-main); cursor: pointer; 
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
    transition: 0.2s; padding: 0;
  }
  .call-actions button:hover { background: var(--accent); }
  .call-actions button svg { width: 20px; height: 20px; }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 65%; padding: 12px 16px; border-radius: 16px; background: var(--bg-panel); align-self: flex-start; font-size: 15px; line-height: 1.5; border-bottom-left-radius: 4px; position: relative; word-wrap: break-word; white-space: pre-wrap;}
  .msg.me { background: var(--accent); align-self: flex-end; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
  .msg .t { display: block; font-size: 11px; opacity: 0.6; margin-top: 6px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 4px;}
  
  .msg .ticks { font-size: 14px; line-height: 1; }
  .msg .ticks.read { color: #60a5fa; } 
  
  .msg.sticker { background: transparent !important; padding: 0 !important; border: none !important; box-shadow: none; }
  .msg.sticker img { width: 120px; height: 120px; object-fit: contain; }
  .msg.sticker .t { display: none; }

  .msg.audio { padding: 8px 12px; min-width: 200px; }
  .msg.audio audio { width: 100%; height: 40px; outline: none; border-radius: 8px; }
  .msg.audio .t { margin-top: 4px; }

  /* Поле ввода */
  #form { position: relative; display: flex; gap: 8px; padding: 16px 24px; background: var(--bg-panel); border-top: 1px solid var(--border-color); align-items: center; }
  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; transition: 0.2s; flex-shrink: 0; }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-main); }
  .icon-btn svg { width: 22px; height: 22px; }
  
  #micBtn.recording { color: var(--danger); animation: pulse 1s infinite; background: rgba(239, 68, 68, 0.1); }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  
  #input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #form button[type="submit"] { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: 0.2s;}
  #form button[type="submit"]:hover { background: var(--accent-hover); }
  #form button[type="submit"] svg { width: 20px; height: 20px; margin-left: -2px; }

  /* Панель стикеров */
  #sticker-panel { position: absolute; bottom: 80px; left: 24px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; width: 300px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #sticker-panel img { width: 100%; cursor: pointer; padding: 4px; border-radius: 8px; transition: 0.1s; }
  #sticker-panel img:hover { transform: scale(1.15); background: var(--bg-hover); }
  .custom-sticker-btn { width: 100%; height: 100%; aspect-ratio: 1; border-radius: 8px; border: 2px dashed var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); font-size: 24px; transition: 0.2s; }
  .custom-sticker-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.1); }

  /* ---------- МОДАЛЬНОЕ ОКНО НАСТРОЕК ---------- */
  #settings-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
  .settings-content { background: var(--bg-panel); width: 90%; max-width: 400px; border-radius: 20px; padding: 24px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  .settings-content h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); }
  .setting-item:last-of-type { border-bottom: none; margin-bottom: 20px; }
  .setting-item label { font-size: 15px; color: var(--text-muted); }
  .settings-btn { background: var(--bg-hover); border: none; color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .settings-btn:hover { background: var(--accent); }
  .close-settings { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* ---------- ЗВОНКИ (ОКНО) ---------- */
  #call-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
  .video-container { position: relative; width: 90%; max-width: 900px; height: 50vh; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; }
  #remote-video { width: 100%; height: 100%; object-fit: cover; }
  #local-video { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 110px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); background: #1e293b; }
  .call-controls { display: flex; gap: 20px; }
  .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
  .call-btn svg { width: 28px; height: 28px; }
  .btn-accept { background: var(--success); }
  .btn-reject, .btn-hangup { background: var(--danger); }
  #call-status { font-size: 24px; margin-bottom: 20px; text-align: center; }

  /* Мобильная адаптация */
  .mobile-back { display: none; background: transparent; border: none; color: var(--text-main); cursor: pointer; padding-right: 12px; }
  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    aside { display: flex; width: 100%; border-right: none; }
    main { display: none; width: 100%; }
    #app.chat-open aside { display: none; }
    #app.chat-open main { display: flex; }
    .mobile-back { display: block; }
    .msg { max-width: 85%; }
    #sticker-panel { left: 12px; width: calc(100% - 24px); }
    #form { padding: 12px; gap: 4px; }
    .icon-btn { width: 36px; height: 36px; }
    .icon-btn svg { width: 20px; height: 20px; }
    #input { padding: 12px 16px; }
  }
</style>
</head>
<body>

<div id="auth">
  <h1>Добро пожаловать</h1>
  <form id="auth-form">
    <input id="u" name="username" placeholder="Придумайте логин" autocomplete="username" required />
    <input id="p" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required />
    <button type="submit" id="login">Войти</button>
  </form>
  <button id="reg" type="button">Создать аккаунт</button>
  <div id="err"></div>
</div>

<div id="app" class="hidden">
  <input type="file" id="avatarInput" accept="image/*" class="hidden" />
  <input type="file" id="customStickerInput" accept="image/*" class="hidden" />

  <aside>
    <header>
      <div class="user-profile" id="myProfileBtn">
        <div class="avatar" id="me-avatar">?</div>
        <div class="user-info">
          <b id="me">...</b>
          <span>в сети</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="settingsBtn" type="button" title="Настройки">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="addBtn" type="button" title="Добавить контакт">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
        </button>
      </div>
    </header>
    
    <div class="users-container">
      <ul id="users"></ul>
      <div id="empty-contacts">
        <p>У вас пока нет контактов.<br>Нажмите <b>+</b>, чтобы добавить.</p>
      </div>
    </div>
  </aside>

  <main>
    <div id="empty-chat">
      <h2>Выберите собеседника</h2>
      <p>Выберите контакт из списка слева.</p>
    </div>

    <div id="chat-view" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <header id="chatHeader">
        <button class="mobile-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <div class="chat-info">
          <div class="avatar" id="chat-avatar">?</div>
          <div>
            <div class="title" id="chatTitle">...</div>
            <div id="typing-indicator">печатает...</div>
          </div>
        </div>
        <div class="call-actions">
          <button id="audioCallBtn" title="Аудиозвонок">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
          </button>
          <button id="videoCallBtn" title="Видеозвонок">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
          </button>
        </div>
      </header>
      <div id="messages"></div>
      
      <form id="form" class="hidden">
        <button type="button" id="stickerBtn" class="icon-btn" title="Стикеры">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        </button>
        <button type="button" id="micBtn" class="icon-btn" title="Записать голосовое">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        
        <input id="input" autocomplete="off" placeholder="Сообщение..." />
        
        <button type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
        <div id="sticker-panel" class="hidden"></div>
      </form>
    </div>
  </main>
</div>

<div id="settings-modal" class="hidden">
  <div class="settings-content">
    <h2>Настройки профиля</h2>
    <div class="setting-item">
      <label>Аватарка</label>
      <button class="settings-btn" id="changeAvatarBtn">Изменить фото</button>
    </div>
    <div class="setting-item">
      <label>Выйти из аккаунта</label>
      <button class="settings-btn" id="logoutBtn" style="background: rgba(239,68,68,0.2); color: #ef4444;">Выйти</button>
    </div>
    <button class="close-settings" id="closeSettingsBtn">Закрыть</button>
  </div>
</div>

<div id="call-overlay" class="hidden">
  <div id="call-status">Вызов...</div>
  <div class="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div class="call-controls" id="incoming-controls" style="display:none;">
    <button class="call-btn btn-accept" id="acceptCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
    <button class="call-btn btn-reject" id="rejectCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></button>
  </div>
  <div class="call-controls" id="active-controls" style="display:none;">
    <button class="call-btn btn-hangup" id="hangupBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const LS_TOKEN = 'pm_token';
const LS_USER  = 'pm_user';

let token = localStorage.getItem(LS_TOKEN);
let me    = null;
try { me = JSON.parse(localStorage.getItem(LS_USER) || 'null'); } catch {}
let socket = null, current = null;
let usersList = [], onlineSet = new Set();

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function renderAvatar(container, username, avatarBase64) {
  container.innerHTML = '';
  if (avatarBase64) {
    const img = document.createElement('img');
    img.src = avatarBase64;
    container.appendChild(img);
  } else {
    container.textContent = username.charAt(0).toUpperCase();
  }
}

async function api(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка сети');
  return j;
}

function saveSession(t, user) { token = t; me = user; localStorage.setItem(LS_TOKEN, t); localStorage.setItem(LS_USER, JSON.stringify(user)); }
function clearSession() { token = null; me = null; localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_USER); }

$('auth-form').onsubmit = (e) => { e.preventDefault(); auth('/api/login'); };
$('reg').onclick = () => auth('/api/register');
async function auth(path) {
  $('err').textContent = '';
  try {
    const { token: t, user } = await api(path, { username: $('u').value.trim(), password: $('p').value });
    saveSession(t, user); start();
  } catch (e) { $('err').textContent = e.message; }
}

function start() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('me').textContent = me.username;
  renderAvatar($('me-avatar'), me.username, me.avatar);

  socket = io({ auth: { token } });

  socket.on('connect', () => socket.emit('users', rows => { usersList = rows; renderUsers(); }));
  socket.on('users', rows => { usersList = rows; renderUsers(); });
  socket.on('online', ids => { onlineSet = new Set(ids); renderUsers(); });
  
  socket.on('message', m => { 
    if (current && (m.fromId === current.id || m.toId === current.id)) {
      renderMessage(m);
      if (m.fromId === current.id) socket.emit('mark-read', { toId: current.id });
    }
  });

  socket.on('typing', ({ fromId, isTyping }) => {
    if (current && current.id === fromId) $('typing-indicator').classList.toggle('visible', isTyping);
  });

  socket.on('messages-read', () => {
    if (current) {
      document.querySelectorAll('.msg.me .ticks').forEach(el => {
        el.textContent = '✓✓';
        el.classList.add('read');
      });
    }
  });

  setupWebRTC();
  initStickers();
  setupTyping();
  setupAudioRecording();
  setupSettings();
}

function setupSettings() {
  $('settingsBtn').onclick = () => $('settings-modal').classList.remove('hidden');
  $('closeSettingsBtn').onclick = () => $('settings-modal').classList.add('hidden');
  $('changeAvatarBtn').onclick = () => { $('avatarInput').click(); $('settings-modal').classList.add('hidden'); };
  $('logoutBtn').onclick = () => { clearSession(); location.reload(); };
}

$('avatarInput').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 150;
      let width = img.width, height = img.height;
      if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
      else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const base64Str = canvas.toDataURL('image/jpeg', 0.8);
      
      fetch('/api/avatar', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ avatar: base64Str }) })
      .then(res => res.json()).then(data => {
        if (data.ok) { me.avatar = data.avatar; saveSession(token, me); renderAvatar($('me-avatar'), me.username, me.avatar); }
      });
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

const STICKERS = ['1f602','2764_fe0f','1f44d','1f525','1f62d','1f621','1f973','1f914','1f634','1f92f','1f929','1f648'];
function initStickers() {
  const panel = $('sticker-panel');
  STICKERS.forEach(code => {
    const img = document.createElement('img');
    img.src = `https://fonts.gstatic.com/s/e/notoemoji/latest/${code}/512.gif`;
    img.onclick = () => { sendSticker(img.src); panel.classList.add('hidden'); };
    panel.appendChild(img);
  });
  const addBtn = document.createElement('div');
  addBtn.className = 'custom-sticker-btn';
  addBtn.innerHTML = '+';
  addBtn.title = "Загрузить свой стикер";
  addBtn.onclick = () => $('customStickerInput').click();
  panel.appendChild(addBtn);

  $('stickerBtn').onclick = (e) => { e.stopPropagation(); panel.classList.toggle('hidden'); };
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== $('stickerBtn')) panel.classList.add('hidden');
  });
}

$('customStickerInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 150;
      let width = img.width, height = img.height;
      if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
      else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const base64Str = canvas.toDataURL('image/png'); 
      sendSticker(base64Str);
      $('sticker-panel').classList.add('hidden');
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

function sendSticker(url) {
  if (!current) return;
  socket.emit('message', { toId: current.id, body: url, type: 'sticker' }, (res) => { renderMessage(res.msg); });
}

let typingTimeout = null;
function setupTyping() {
  $('input').addEventListener('input', () => {
    if (!current) return;
    socket.emit('typing', { toId: current.id, isTyping: true });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => socket.emit('typing', { toId: current.id, isTyping: false }), 1500);
  });
}

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
const micSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>`;
const stopSvg = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>`;

function setupAudioRecording() {
  $('micBtn').onclick = async () => {
    if (!current) return alert('Выберите собеседника');
    if (isRecording) { mediaRecorder.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
      mediaRecorder.onstop = () => {
        isRecording = false;
        $('micBtn').classList.remove('recording');
        $('micBtn').innerHTML = micSvg;
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        reader.readAsDataURL(audioBlob);
        reader.onloadend = () => {
          socket.emit('message', { toId: current.id, body: reader.result, type: 'audio' }, (res) => { renderMessage(res.msg); });
        };
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      $('micBtn').classList.add('recording');
      $('micBtn').innerHTML = stopSvg;
    } catch (err) { alert('Не удалось получить доступ к микрофону: ' + err.message); }
  };
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  const body = $('input').value.trim();
  if (!body || !current) return;
  socket.emit('message', { toId: current.id, body, type: 'text' }, (res) => {
    if (res && res.error) return alert(res.error);
    renderMessage(res.msg);
    socket.emit('typing', { toId: current.id, isTyping: false });
  });
  $('input').value = '';
};

function renderMessage(m) {
  const d = document.createElement('div');
  if (m.type === 'sticker') {
    d.className = 'msg sticker' + (m.fromId === me.id ? ' me' : '');
    d.innerHTML = `<img src="${escapeHtml(m.body)}" alt="sticker">`;
  } else if (m.type === 'audio') {
    d.className = 'msg audio' + (m.fromId === me.id ? ' me' : '');
    d.innerHTML = `<audio controls src="${m.body}"></audio>`;
    const timeSpan = document.createElement('span');
    timeSpan.className = 't';
    timeSpan.innerHTML = new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    if (m.fromId === me.id) {
      const ticks = document.createElement('span');
      ticks.className = 'ticks' + (m.read ? ' read' : '');
      ticks.textContent = m.read ? '✓✓' : '✓';
      timeSpan.appendChild(ticks);
    }
    d.appendChild(timeSpan);
  } else {
    d.className = 'msg' + (m.fromId === me.id ? ' me' : '');
    d.innerHTML = `${escapeHtml(m.body)}`;
    const timeSpan = document.createElement('span');
    timeSpan.className = 't';
    timeSpan.innerHTML = new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    if (m.fromId === me.id) {
      const ticks = document.createElement('span');
      ticks.className = 'ticks' + (m.read ? ' read' : '');
      ticks.textContent = m.read ? '✓✓' : '✓';
      timeSpan.appendChild(ticks);
    }
    d.appendChild(timeSpan);
  }
  $('messages').appendChild(d);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function openChat(u) {
  current = u;
  $('app').classList.add('chat-open');
  $('empty-chat').classList.add('hidden');
  $('chat-view').classList.remove('hidden');
  $('form').classList.remove('hidden');
  $('chatTitle').textContent = u.username;
  renderAvatar($('chat-avatar'), u.username, u.avatar);
  $('typing-indicator').classList.remove('visible');
  $('messages').innerHTML = '';
  renderUsers();
  socket.emit('history', { withId: u.id }, rows => {
    rows.forEach(renderMessage);
    socket.emit('mark-read', { toId: u.id });
  });
}

$('backBtn').onclick = () => {
  $('app').classList.remove('chat-open');
  current = null;
  $('chat-view').classList.add('hidden');
  $('empty-chat').classList.remove('hidden');
  $('form').classList.add('hidden');
  renderUsers();
};

function renderUsers() {
  const ul = $('users'); ul.innerHTML = '';
  $('empty-contacts').style.display = usersList.length === 0 ? 'flex' : 'none';
  for (const u of usersList) {
    const li = document.createElement('li');
    li.className = current && current.id === u.id ? 'active' : '';
    const leftDiv = document.createElement('div'); leftDiv.className = 'contact-left';
    const avatarDiv = document.createElement('div'); avatarDiv.className = 'avatar'; renderAvatar(avatarDiv, u.username, u.avatar);
    const nameSpan = document.createElement('span'); nameSpan.className = 'username'; nameSpan.textContent = u.username;
    leftDiv.appendChild(avatarDiv); leftDiv.appendChild(nameSpan);
    const dot = document.createElement('span'); dot.className = 'dot' + (onlineSet.has(u.id) ? ' on' : '');
    li.appendChild(leftDiv); li.appendChild(dot);
    li.onclick = () => openChat(u);
    ul.appendChild(li);
  }
}

function promptAddContact() {
  const username = prompt('Введите юзернейм пользователя:');
  if (!username || !username.trim()) return;
  socket.emit('add-contact', { username: username.trim() }, (res) => { if (res && res.error) alert(res.error); });
}
$('addBtn').onclick = promptAddContact;
$('myProfileBtn').onclick = () => $('settingsBtn').click();

let peerConnection = null, localStream = null, remoteStream = null, currentCallTarget = null;
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function setupWebRTC() {
  socket.on('incoming-call', async ({ fromId, fromName, offer, type }) => {
    currentCallTarget = fromId;
    $('call-overlay').classList.remove('hidden');
    $('call-status').innerHTML = `Входящий ${type === 'video' ? 'видео' : 'аудио'} звонок от <span id="call-peer-name">${fromName}</span>`;
    $('incoming-controls').style.display = 'flex'; $('active-controls').style.display = 'none';
    window.pendingOffer = offer; window.pendingType = type;
  });
  socket.on('call-answered', async ({ answer }) => { if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); });
  socket.on('ice-candidate', async ({ candidate }) => { if (peerConnection && candidate) try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){} });
  socket.on('call-ended', () => endCall(false));

  $('acceptCallBtn').onclick = async () => {
    $('incoming-controls').style.display = 'none'; $('active-controls').style.display = 'flex';
    await initMedia(window.pendingType === 'video'); createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingOffer));
    const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
    socket.emit('answer-call', { toId: currentCallTarget, answer });
  };
  $('rejectCallBtn').onclick = () => { socket.emit('end-call', { toId: currentCallTarget }); endCall(false); };
  $('hangupBtn').onclick = () => { socket.emit('end-call', { toId: currentCallTarget }); endCall(false); };
  $('audioCallBtn').onclick = () => startCall('audio');
  $('videoCallBtn').onclick = () => startCall('video');
}

async function initMedia(useVideo) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: useVideo });
    $('local-video').srcObject = localStream; $('local-video').style.display = useVideo ? 'block' : 'none';
  } catch (err) { alert('Нет доступа к камере: ' + err.message); throw err; }
}
function createPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  remoteStream = new MediaStream(); $('remote-video').srcObject = remoteStream;
  peerConnection.ontrack = (event) => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };
  peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit('ice-candidate', { toId: currentCallTarget, candidate: event.candidate }); };
  peerConnection.onconnectionstatechange = () => { if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') endCall(false); };
}
async function startCall(type) {
  if (!current) return alert('Выберите собеседника');
  if (!onlineSet.has(current.id)) return alert('Собеседник не в сети');
  currentCallTarget = current.id;
  $('call-overlay').classList.remove('hidden'); $('call-status').innerHTML = `Вызов <span id="call-peer-name">${current.username}</span>...`;
  $('incoming-controls').style.display = 'none'; $('active-controls').style.display = 'flex';
  try {
    await initMedia(type === 'video'); createPeerConnection();
    const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
    socket.emit('call-user', { toId: current.id, offer, type });
  } catch (e) { endCall(false); }
}
function endCall(notifyPeer = true) {
  if (notifyPeer && currentCallTarget) socket.emit('end-call', { toId: currentCallTarget });
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
  $('local-video').srcObject = null; $('remote-video').srcObject = null;
  $('call-overlay').classList.add('hidden'); currentCallTarget = null;
}

if (token && me) start();
