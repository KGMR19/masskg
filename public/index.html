<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<!-- Обязательный тег для корректного отображения на iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Private Messenger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0f172a;
    --bg-panel: #1e293b;
    --bg-hover: #334155;
    --bg-input: #0f172a;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-light: #60a5fa;
    --border-color: #334155;
    --danger: #ef4444;
    --success: #22c55e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-main);
    height: 100vh;
    height: 100dvh; /* Для мобильных браузеров (учитывает адресную строку) */
    overflow: hidden;
  }

  .hidden { display: none !important; }

  /* ---------- АВТОРИЗАЦИЯ ---------- */
  #auth { max-width: 380px; margin: 10vh auto; padding: 32px; background: var(--bg-panel); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid var(--border-color); }
  #auth h1 { font-size: 24px; margin-bottom: 24px; text-align: center; letter-spacing: -0.5px; }
  #auth input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; transition: border 0.2s; }
  #auth input:focus { border-color: var(--accent); }
  #auth button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 15px; }
  #auth button:hover { background: var(--accent-hover); }
  #auth #reg { background: transparent; border: 1px solid var(--border-color); margin-top: 12px; }
  #auth #reg:hover { background: var(--bg-hover); }
  #err { color: #f87171; font-size: 14px; text-align: center; margin-top: 16px; min-height: 20px; }

  /* ---------- ОСНОВНОЙ ИНТЕРФЕЙС ---------- */
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; width: 100vw; }

  /* ---------- ЛЕВАЯ ПАНЕЛЬ ---------- */
  aside { background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
  aside header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
  
  .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px; border-radius: 12px; transition: background 0.2s; }
  .user-profile:hover { background: var(--bg-hover); }
  
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 16px; color: white; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .user-info { display: flex; flex-direction: column; }
  .user-info b { font-size: 15px; }
  .user-info span { font-size: 12px; color: var(--success); }

  .header-actions { display: flex; gap: 8px; }
  .header-actions button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; transition: all 0.2s; }
  .header-actions button:hover { background: var(--bg-hover); color: var(--text-main); }
  #addBtn { color: var(--accent-light); }

  .users-container { flex: 1; overflow-y: auto; }
  .users-container::-webkit-scrollbar { width: 6px; }
  .users-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
  
  #users { list-style: none; padding: 12px; }
  #users li { padding: 8px 12px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; margin-bottom: 4px; }
  #users li:hover { background: var(--bg-hover); }
  #users li.active { background: var(--accent); color: white; }
  #users li.active .dot { border-color: var(--accent); }
  
  .contact-left { display: flex; align-items: center; gap: 12px; }
  .contact-left .avatar { width: 36px; height: 36px; font-size: 14px; }
  .username { font-size: 15px; }
  
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; border: 2px solid var(--bg-panel); transition: background 0.3s; }
  .dot.on { background: var(--success); }

  #empty-contacts { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 20px; text-align: center; color: var(--text-muted); }
  #empty-contacts svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
  #empty-contacts b { color: var(--accent-light); cursor: pointer; }

  /* ---------- ПРАВАЯ ПАНЕЛЬ (ЧАТ) ---------- */
  main { display: flex; flex-direction: column; background: var(--bg-base); position: relative; height: 100%; }
  
  #empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; }
  #empty-chat svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.3; }
  #empty-chat h2 { font-size: 20px; color: var(--text-main); margin-bottom: 8px; font-weight: 500;}

  main header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
  .chat-info { display: flex; align-items: center; gap: 12px; }
  main header .avatar { width: 40px; height: 40px; font-size: 16px; }
  main header .title { font-weight: 600; font-size: 16px; }

  .call-actions { display: flex; gap: 8px; }
  .call-actions button { background: var(--bg-hover); border: none; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; transition: all 0.2s; }
  .call-actions button:hover { background: var(--accent); }
  .call-actions button svg { width: 20px; height: 20px; }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

  .msg { max-width: 60%; padding: 12px 16px; border-radius: 16px; background: var(--bg-panel); align-self: flex-start; font-size: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; border-bottom-left-radius: 4px; animation: fadeIn 0.2s ease-out; }
  .msg.me { background: var(--accent); align-self: flex-end; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
  .msg .t { display: block; font-size: 11px; opacity: 0.6; margin-top: 6px; text-align: right; }
  
  .msg.sticker { background: transparent !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
  .msg.sticker img { width: 120px; height: 120px; object-fit: contain; }
  .msg.sticker .t { display: none; }
  
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  #form { position: relative; display: flex; gap: 12px; padding: 20px 24px; background: var(--bg-panel); border-top: 1px solid var(--border-color); align-items: center; }
  .sticker-btn { background: transparent; border: none; font-size: 24px; cursor: pointer; padding: 0 4px; transition: transform 0.2s; }
  .sticker-btn:hover { transform: scale(1.1); }
  #input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; transition: border 0.2s; }
  #input:focus { border-color: var(--accent); }
  #form button[type="submit"] { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: background 0.2s; flex-shrink: 0; }
  #form button[type="submit"] svg { width: 20px; height: 20px; margin-left: -2px; }

  #sticker-panel { position: absolute; bottom: 80px; left: 24px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; width: 280px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; }
  #sticker-panel img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; border-radius: 8px; transition: transform 0.1s; padding: 4px; }
  #sticker-panel img:hover { transform: scale(1.15); background: var(--bg-hover); }

  /* ---------- ОКНО ЗВОНКА (OVERLAY) ---------- */
  #call-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
  #call-status { font-size: 24px; font-weight: 500; margin-bottom: 20px; text-align: center; padding: 0 20px; }
  #call-peer-name { color: var(--accent-light); font-weight: 600; }
  .video-container { position: relative; width: 90%; max-width: 900px; height: 50vh; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; }
  #remote-video { width: 100%; height: 100%; object-fit: cover; }
  #local-video { position: absolute; bottom: 20px; right: 20px; width: 150px; height: 110px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.2); background: #1e293b; }
  .call-controls { display: flex; gap: 20px; }
  .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
  .call-btn svg { width: 28px; height: 28px; }
  .btn-accept { background: var(--success); }
  .btn-reject, .btn-hangup { background: var(--danger); }

  /* Кнопка "Назад" для мобильных */
  .mobile-back { display: none; background: transparent; border: none; color: var(--text-main); cursor: pointer; padding-right: 12px; }
  .mobile-back svg { width: 24px; height: 24px; }

  /* ---------- АДАПТИВНОСТЬ ДЛЯ IPHONE И ТЕЛЕФОНОВ ---------- */
  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    
    /* По умолчанию показываем список контактов */
    aside { display: flex; width: 100%; border-right: none; }
    main { display: none; width: 100%; }
    
    /* Когда чат открыт, скрываем список и показываем чат */
    #app.chat-open aside { display: none; }
    #app.chat-open main { display: flex; }
    
    .mobile-back { display: block; }
    .msg { max-width: 85%; }
    
    #sticker-panel { left: 12px; width: calc(100% - 24px); }
    #form { padding: 12px; }
  }
</style>
</head>
<body>

<div id="auth">
  <h1>Добро пожаловать</h1>
  <!-- Обернули в form, чтобы браузер предлагал сохранить пароль -->
  <form id="auth-form">
    <input id="u" name="username" placeholder="Придумайте логин" autocomplete="username" required />
    <input id="p" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required />
    <button type="submit" id="login">Войти</button>
  </form>
  <button id="reg" type="button">Создать аккаунт</button>
  <div id="err"></div>
</div>

<div id="app" class="hidden">
  <input type="file" id="avatarInput" accept="image/*" class="hidden" />

  <aside>
    <header>
      <div class="user-profile" id="myProfileBtn" title="Изменить аватарку">
        <div class="avatar" id="me-avatar">?</div>
        <div class="user-info">
          <b id="me">...</b>
          <span>в сети</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="addBtn" type="button" title="Добавить контакт">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
        </button>
        <button id="logout" type="button" title="Выйти">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
      </div>
    </header>
    
    <div class="users-container">
      <ul id="users"></ul>
      <div id="empty-contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <p>У вас пока нет контактов.<br>Нажмите на <b id="empty-add-btn">иконку добавления</b>.</p>
      </div>
    </div>
  </aside>

  <main>
    <div id="empty-chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <h2>Выберите собеседника</h2>
      <p>Выберите контакт из списка слева, чтобы начать общение.</p>
    </div>

    <div id="chat-view" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <header id="chatHeader">
        <!-- Кнопка "Назад" для телефона -->
        <button class="mobile-back" id="backBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <div class="chat-info">
          <div class="avatar" id="chat-avatar">?</div>
          <div class="title" id="chatTitle">...</div>
        </div>
        <div class="call-actions">
          <button id="audioCallBtn" title="Аудиозвонок">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </button>
          <button id="videoCallBtn" title="Видеозвонок">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
        </div>
      </header>
      <div id="messages"></div>
      
      <form id="form" class="hidden">

        <input id="input" autocomplete="off" placeholder="Сообщение..." />
        <button type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
        <div id="sticker-panel" class="hidden"></div>
      </form>
    </div>
  </main>
</div>

<div id="call-overlay" class="hidden">
  <div id="call-status">Вызов...</div>
  <div class="video-container">
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted></video>
  </div>
  <div class="call-controls" id="incoming-controls" style="display:none;">
    <button class="call-btn btn-accept" id="acceptCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
    <button class="call-btn btn-reject" id="rejectCallBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></button>
  </div>
  <div class="call-controls" id="active-controls" style="display:none;">
    <button class="call-btn btn-hangup" id="hangupBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path><line x1="23" y1="1" x2="1" y2="23"></line></svg></button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const LS_TOKEN = 'pm_token';
const LS_USER  = 'pm_user';

let token = localStorage.getItem(LS_TOKEN);
let me    = null;
try { me = JSON.parse(localStorage.getItem(LS_USER) || 'null'); } catch {}
let socket = null, current = null;
let usersList = [], onlineSet = new Set();

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function renderAvatar(container, username, avatarBase64) {
  container.innerHTML = '';
  if (avatarBase64) {
    const img = document.createElement('img');
    img.src = avatarBase64;
    container.appendChild(img);
  } else {
    container.textContent = username.charAt(0).toUpperCase();
  }
}

async function api(path, data) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Ошибка сети');
  return j;
}

function saveSession(t, user) { token = t; me = user; localStorage.setItem(LS_TOKEN, t); localStorage.setItem(LS_USER, JSON.stringify(user)); }
function clearSession() { token = null; me = null; localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_USER); }

// Отправка формы (Вход)
$('auth-form').onsubmit = (e) => {
  e.preventDefault();
  auth('/api/login');
};
// Регистрация
$('reg').onclick = () => auth('/api/register');

async function auth(path) {
  $('err').textContent = '';
  try {
    const { token: t, user } = await api(path, { username: $('u').value.trim(), password: $('p').value });
    saveSession(t, user); start();
  } catch (e) { $('err').textContent = e.message; }
}

$('logout').onclick = () => { clearSession(); location.reload(); };

function start() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('me').textContent = me.username;
  renderAvatar($('me-avatar'), me.username, me.avatar);

  socket = io({ auth: { token } });

  socket.on('connect', () => socket.emit('users', rows => { usersList = rows; renderUsers(); }));
  socket.on('connect_error', (e) => { console.error('socket error:', e.message); clearSession(); location.reload(); });
  socket.on('users', rows => { usersList = rows; renderUsers(); });
  socket.on('online', ids => { onlineSet = new Set(ids); renderUsers(); });
  socket.on('message', m => { if (current && (m.fromId === current.id || m.toId === current.id)) renderMessage(m); });

  setupWebRTC();
  initStickers();
}

/* ================= СТИКЕРЫ ================= */
const STICKERS = [
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/2764_fe0f/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f44d/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f621/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f973/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f914/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f634/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f92f/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f929/512.gif',
  'https://fonts.gstatic.com/s/e/notoemoji/latest/1f648/512.gif'
];

function initStickers() {
  const panel = $('sticker-panel');
  STICKERS.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.onclick = () => { sendSticker(url); panel.classList.add('hidden'); };
    panel.appendChild(img);
  });

  $('stickerBtn').onclick = (e) => { e.stopPropagation(); panel.classList.toggle('hidden'); };
  document.addEventListener('click', (e) => {
    if (!panel.contains(e.target) && e.target !== $('stickerBtn')) panel.classList.add('hidden');
  });
}

function sendSticker(url) {
  if (!current) return alert('Выберите собеседника');
  socket.emit('message', { toId: current.id, body: url, type: 'sticker' }, (res) => {
    if (res && res.error) return alert(res.error);
    renderMessage(res.msg);
  });
}

/* ================= СМЕНА АВАТАРКИ ================= */
$('myProfileBtn').onclick = () => $('avatarInput').click();
$('avatarInput').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 150;
      let width = img.width, height = img.height;
      if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
      else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const base64Str = canvas.toDataURL('image/jpeg', 0.8);
      
      fetch('/api/avatar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ avatar: base64Str })
      }).then(res => res.json()).then(data => {
        if (data.ok) { me.avatar = data.avatar; saveSession(token, me); renderAvatar($('me-avatar'), me.username, me.avatar); }
      });
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
};

function promptAddContact() {
  const username = prompt('Введите юзернейм пользователя:');
  if (!username || !username.trim()) return;
  socket.emit('add-contact', { username: username.trim() }, (res) => { if (res && res.error) alert(res.error); });
}
$('addBtn').onclick = promptAddContact;
$('empty-add-btn').onclick = promptAddContact;

function renderUsers() {
  const ul = $('users'); ul.innerHTML = '';
  $('empty-contacts').style.display = usersList.length === 0 ? 'flex' : 'none';

  for (const u of usersList) {
    const li = document.createElement('li');
    li.className = current && current.id === u.id ? 'active' : '';
    const leftDiv = document.createElement('div'); leftDiv.className = 'contact-left';
    const avatarDiv = document.createElement('div'); avatarDiv.className = 'avatar'; renderAvatar(avatarDiv, u.username, u.avatar);
    const nameSpan = document.createElement('span'); nameSpan.className = 'username'; nameSpan.textContent = u.username;
    leftDiv.appendChild(avatarDiv); leftDiv.appendChild(nameSpan);
    const dot = document.createElement('span'); dot.className = 'dot' + (onlineSet.has(u.id) ? ' on' : '');
    li.appendChild(leftDiv); li.appendChild(dot);
    li.onclick = () => openChat(u);
    ul.appendChild(li);
  }
}

function openChat(u) {
  current = u;
  $('app').classList.add('chat-open'); // Включаем режим чата для мобилок
  $('empty-chat').classList.add('hidden');
  $('chat-view').classList.remove('hidden');
  $('form').classList.remove('hidden');
  $('chatTitle').textContent = u.username;
  renderAvatar($('chat-avatar'), u.username, u.avatar);
  $('messages').innerHTML = '';
  renderUsers();
  socket.emit('history', { withId: u.id }, rows => rows.forEach(renderMessage));
}

// Кнопка Назад (сбрасываем режим чата)
$('backBtn').onclick = () => {
  $('app').classList.remove('chat-open');
  current = null;
  $('chat-view').classList.add('hidden');
  $('empty-chat').classList.remove('hidden');
  $('form').classList.add('hidden');
  renderUsers();
};

function renderMessage(m) {
  const d = document.createElement('div');
  if (m.type === 'sticker') {
    d.className = 'msg sticker' + (m.fromId === me.id ? ' me' : '');
    d.innerHTML = `<img src="${escapeHtml(m.body)}" alt="sticker">`;
  } else {
    d.className = 'msg' + (m.fromId === me.id ? ' me' : '');
    d.innerHTML = `${escapeHtml(m.body)}<span class="t">${new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
  }
  $('messages').appendChild(d);
  $('messages').scrollTop = $('messages').scrollHeight;
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  const body = $('input').value.trim();
  if (!body || !current) return;
  socket.emit('message', { toId: current.id, body, type: 'text' }, (res) => {
    if (res && res.error) return alert(res.error);
    renderMessage(res.msg);
  });
  $('input').value = '';
};

/* ================= ЗВОНКИ ================= */
let peerConnection = null, localStream = null, remoteStream = null, currentCallTarget = null;
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function setupWebRTC() {
  socket.on('incoming-call', async ({ fromId, fromName, offer, type }) => {
    currentCallTarget = fromId;
    $('call-overlay').classList.remove('hidden');
    $('call-status').innerHTML = `Входящий ${type === 'video' ? 'видео' : 'аудио'} звонок от <span id="call-peer-name">${fromName}</span>`;
    $('incoming-controls').style.display = 'flex'; $('active-controls').style.display = 'none';
    window.pendingOffer = offer; window.pendingType = type;
  });
  socket.on('call-answered', async ({ answer }) => { if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer)); });
  socket.on('ice-candidate', async ({ candidate }) => { if (peerConnection && candidate) try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){} });
  socket.on('call-ended', () => endCall(false));

  $('acceptCallBtn').onclick = async () => {
    $('incoming-controls').style.display = 'none'; $('active-controls').style.display = 'flex';
    await initMedia(window.pendingType === 'video'); createPeerConnection();
    await peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingOffer));
    const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
    socket.emit('answer-call', { toId: currentCallTarget, answer });
  };
  $('rejectCallBtn').onclick = () => { socket.emit('end-call', { toId: currentCallTarget }); endCall(false); };
  $('hangupBtn').onclick = () => { socket.emit('end-call', { toId: currentCallTarget }); endCall(false); };
  $('audioCallBtn').onclick = () => startCall('audio');
  $('videoCallBtn').onclick = () => startCall('video');
}

async function initMedia(useVideo) {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: useVideo });
    $('local-video').srcObject = localStream; $('local-video').style.display = useVideo ? 'block' : 'none';
  } catch (err) { alert('Нет доступа к камере/микрофону: ' + err.message); throw err; }
}

function createPeerConnection() {
  peerConnection = new RTCPeerConnection(rtcConfig);
  localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
  remoteStream = new MediaStream(); $('remote-video').srcObject = remoteStream;
  peerConnection.ontrack = (event) => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };
  peerConnection.onicecandidate = (event) => { if (event.candidate) socket.emit('ice-candidate', { toId: currentCallTarget, candidate: event.candidate }); };
  peerConnection.onconnectionstatechange = () => { if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') endCall(false); };
}

async function startCall(type) {
  if (!current) return alert('Выберите собеседника');
  if (!onlineSet.has(current.id)) return alert('Собеседник не в сети');
  currentCallTarget = current.id;
  $('call-overlay').classList.remove('hidden'); $('call-status').innerHTML = `Вызов <span id="call-peer-name">${current.username}</span>...`;
  $('incoming-controls').style.display = 'none'; $('active-controls').style.display = 'flex';
  try {
    await initMedia(type === 'video'); createPeerConnection();
    const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
    socket.emit('call-user', { toId: current.id, offer, type });
  } catch (e) { endCall(false); }
}

function endCall(notifyPeer = true) {
  if (notifyPeer && currentCallTarget) socket.emit('end-call', { toId: currentCallTarget });
  if (peerConnection) { peerConnection.close(); peerConnection = null; }
  if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
  $('local-video').srcObject = null; $('remote-video').srcObject = null;
  $('call-overlay').classList.add('hidden'); currentCallTarget = null;
}

if (token && me) start();
