<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Secure Messenger</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg-base: #0b0f19; --bg-panel: #111827; --bg-hover: #1f2937; --bg-input: #1f2937; --text-main: #f3f4f6; --text-muted: #9ca3af; --accent: #6366f1; --accent-hover: #4f46e5; --accent-light: #818cf8; --border-color: #374151; --danger: #ef4444; --success: #10b981; --bubble-me: linear-gradient(135deg, #6366f1, #8b5cf6); --bubble-other: #1f2937; }
  body.theme-blue { --bg-base: #0f172a; --bg-panel: #1e293b; --bg-hover: #334155; --bg-input: #0f172a; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb; --accent-light: #60a5fa; --border-color: #334155; --bubble-me: linear-gradient(135deg, #3b82f6, #06b6d4); --bubble-other: #1e293b; }
  body.theme-red { --bg-base: #1a0b0b; --bg-panel: #291111; --bg-hover: #3d1919; --bg-input: #1a0b0b; --text-main: #fef2f2; --text-muted: #fca5a5; --accent: #ef4444; --accent-hover: #dc2626; --accent-light: #f87171; --border-color: #451a1a; --bubble-me: linear-gradient(135deg, #ef4444, #f97316); --bubble-other: #291111; }
  body.theme-gray { --bg-base: #1f2937; --bg-panel: #374151; --bg-hover: #4b5563; --bg-input: #111827; --text-main: #f9fafb; --text-muted: #9ca3af; --accent: #9ca3af; --accent-hover: #6b7280; --accent-light: #d1d5db; --border-color: #4b5563; --bubble-me: linear-gradient(135deg, #6b7280, #4b5563); --bubble-other: #374151; }
  body.theme-pink { --bg-base: #1c0f15; --bg-panel: #2d1721; --bg-hover: #43222f; --bg-input: #1c0f15; --text-main: #fdf2f8; --text-muted: #f9a8d4; --accent: #ec4899; --accent-hover: #db2777; --accent-light: #f472b6; --border-color: #4c1d35; --bubble-me: linear-gradient(135deg, #ec4899, #f43f5e); --bubble-other: #2d1721; }
  body.theme-sunset { --bg-base: #1f1215; --bg-panel: #2e1a1e; --bg-hover: #45252b; --bg-input: #1f1215; --text-main: #fff1f2; --text-muted: #fda4af; --accent: #f97316; --accent-hover: #ea580c; --accent-light: #fb923c; --border-color: #4c1d24; --bubble-me: linear-gradient(135deg, #f97316, #e11d48); --bubble-other: #2e1a1e; }
  body.theme-ocean { --bg-base: #041e24; --bg-panel: #0a2e36; --bg-hover: #114551; --bg-input: #041e24; --text-main: #ecfeff; --text-muted: #67e8f9; --accent: #06b6d4; --accent-hover: #0891b2; --accent-light: #22d3ee; --border-color: #155e75; --bubble-me: linear-gradient(135deg, #06b6d4, #3b82f6); --bubble-other: #0a2e36; }
  body.theme-dracula { --bg-base: #1e1f29; --bg-panel: #282a36; --bg-hover: #44475a; --bg-input: #1e1f29; --text-main: #f8f8f2; --text-muted: #6272a4; --accent: #bd93f9; --accent-hover: #ff79c6; --accent-light: #ffb86c; --border-color: #44475a; --bubble-me: linear-gradient(135deg, #bd93f9, #ff79c6); --bubble-other: #282a36; }
  body.theme-cyberpunk { --bg-base: #09090b; --bg-panel: #18181b; --bg-hover: #27272a; --bg-input: #09090b; --text-main: #facc15; --text-muted: #a1a1aa; --accent: #facc15; --accent-hover: #eab308; --accent-light: #fde047; --border-color: #3f3f46; --bubble-me: linear-gradient(135deg, #facc15, #06b6d4); --bubble-other: #18181b; }
  body.theme-coffee { --bg-base: #1c1512; --bg-panel: #2a1f1a; --bg-hover: #3e2c24; --bg-input: #1c1512; --text-main: #fef3c7; --text-muted: #b45309; --accent: #d97706; --accent-hover: #b45309; --accent-light: #f59e0b; --border-color: #452a1b; --bubble-me: linear-gradient(135deg, #d97706, #78350f); --bubble-other: #2a1f1a; }
  body.theme-deepseek { --bg-base: #030712; --bg-panel: #0f172a; --bg-hover: #1e293b; --bg-input: #030712; --text-main: #e2e8f0; --text-muted: #64748b; --accent: #4f46e5; --accent-hover: #4338ca; --accent-light: #818cf8; --border-color: #1e293b; --bubble-me: linear-gradient(135deg, #4f46e5, #06b6d4); --bubble-other: #0f172a; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-base); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; transition: background 0.3s, color 0.3s; }
  .hidden { display: none !important; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
  .modal-content { background: var(--bg-panel); width: 90%; max-width: 400px; border-radius: 24px; padding: 32px; border: 1px solid var(--border-color); box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
  .modal-content h2 { font-size: 22px; margin-bottom: 20px; text-align: center; }
  .modal-content input, .modal-content select { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); outline: none; font-family: inherit; }
  .modal-content button { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .modal-content button.cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }

  #auth { max-width: 380px; margin: 10vh auto; padding: 32px; background: var(--bg-panel); border-radius: 24px; border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  #auth h1 { font-size: 28px; margin-bottom: 24px; text-align: center; font-weight: 700; background: var(--bubble-me); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  #auth input { width: 100%; padding: 14px 16px; margin-bottom: 16px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; }
  #auth button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: white; font-weight: 600; cursor: pointer; font-size: 15px; margin-bottom: 10px; }
  #auth #reg { background: transparent; border: 1px solid var(--border-color); }
  #err { color: #f87171; font-size: 14px; text-align: center; margin-top: 16px; min-height: 20px; }

  #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; width: 100vw; }
  aside { background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
  aside header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
  .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px; border-radius: 12px; }
  .user-profile:hover { background: var(--bg-hover); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--bubble-me); display: flex; justify-content: center; align-items: center; font-weight: 600; font-size: 18px; color: white; flex-shrink: 0; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info b { font-size: 16px; display: block; font-weight: 600; }
  .user-info span { font-size: 13px; color: var(--success); }
  .header-actions { display: flex; gap: 8px; }
  .header-actions button { background: var(--bg-hover); border: none; color: var(--text-main); cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .header-actions button:hover { background: var(--accent); }
  .header-actions button svg { width: 20px; height: 20px; }

  .search-container { padding: 12px 20px; border-bottom: 1px solid var(--border-color); }
  .search-container input { width: 100%; padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 14px; outline: none; }

  .users-container { flex: 1; overflow-y: auto; padding: 8px; }
  .list-header { padding: 10px 12px; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
  #groups-list, #users-list { list-style: none; }
  #groups-list li, #users-list li { padding: 12px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #groups-list li:hover, #users-list li:hover { background: var(--bg-hover); }
  #groups-list li.active, #users-list li.active { background: var(--accent); color: white; }
  .contact-left { display: flex; align-items: center; gap: 12px; }
  .contact-left .avatar { width: 38px; height: 38px; font-size: 15px; }
  .username { font-size: 15px; font-weight: 500; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4b5563; border: 2px solid var(--bg-panel); }
  .dot.on { background: var(--success); box-shadow: 0 0 8px var(--success); }

  main { display: flex; flex-direction: column; height: 100%; background: var(--bg-base); position: relative; }
  #empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
  main header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--bg-panel); }
  .chat-info { display: flex; align-items: center; gap: 16px; }
  .chat-info .avatar { width: 42px; height: 42px; font-size: 16px; }
  .chat-info .title { font-weight: 600; font-size: 17px; }
  .call-actions { display: flex; gap: 8px; }
  .call-actions button { background: var(--bg-hover); border: none; color: var(--text-main); cursor: pointer; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .call-actions button:hover { background: var(--accent); }
  .call-actions button svg { width: 20px; height: 20px; }
  .close-chat-btn { background: transparent !important; }
  .close-chat-btn:hover { background: var(--danger) !important; }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 65%; padding: 12px 16px; border-radius: 20px; background: var(--bubble-other); align-self: flex-start; font-size: 15px; line-height: 1.5; border-bottom-left-radius: 4px; position: relative; word-wrap: break-word; }
  .msg.me { background: var(--bubble-me); align-self: flex-end; border-bottom-left-radius: 20px; border-bottom-right-radius: 4px; color: white; }
  .msg .sender-name { font-size: 12px; color: var(--accent-light); font-weight: 600; margin-bottom: 4px; display: block; }
  .msg .t { display: block; font-size: 11px; opacity: 0.7; margin-top: 6px; text-align: right; }
  .msg.sticker img { width: 140px; height: 140px; object-fit: contain; }
  .msg.audio audio { width: 100%; height: 40px; outline: none; border-radius: 12px; }

  #form { display: flex; gap: 12px; padding: 16px 24px; background: var(--bg-panel); border-top: 1px solid var(--border-color); align-items: center; }
  .icon-btn { background: transparent; border: none; cursor: pointer; color: var(--text-muted); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-main); }
  .icon-btn svg { width: 24px; height: 24px; }
  #input { flex: 1; padding: 14px 20px; border-radius: 24px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 15px; outline: none; }
  #form button[type="submit"] { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #form button[type="submit"] svg { width: 20px; height: 20px; margin-left: -2px; }
  #sticker-panel { position: absolute; bottom: 85px; left: 24px; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 320px; z-index: 100; }

  .settings-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
  .settings-tab { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; cursor: pointer; font-size: 15px; border-radius: 8px; }
  .settings-tab.active { background: var(--bg-hover); color: var(--text-main); font-weight: 600; }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border-color); }
  .setting-item label { font-size: 15px; color: var(--text-muted); }
  .settings-btn { background: var(--bg-hover); border: none; color: var(--text-main); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; }
  .settings-btn:hover { background: var(--accent); }
  .form-group { margin-bottom: 16px; }
  .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); margin-top: 6px; }
  .btn-save { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

  #call-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: flex; flex-direction: column; z-index: 4000; }
  #video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 10px; align-content: center; justify-content: center; }
  .video-wrapper { position: relative; background: #111; border-radius: 16px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
  .video-name { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; font-size: 12px; color: white; }
  #call-controls-bar { padding: 20px; display: flex; justify-content: center; gap: 20px; background: #0b0f19; }
  .btn-hangup { background: var(--danger); color: white; padding: 16px 32px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; font-size: 16px;}

  @media (max-width: 768px) {
    #app { grid-template-columns: 1fr; }
    aside { display: flex; width: 100%; }
    main { display: none; width: 100%; }
    #app.chat-open aside { display: none; }
    #app.chat-open main { display: flex; }
    .msg { max-width: 85%; }
    #sticker-panel { width: calc(100% - 24px); left: 12px; }
  }
</style>
</head>
<body>

<div id="auth">
  <h1>Secure Messenger</h1>
  <form id="auth-form">
    <input id="u" name="username" placeholder="Логин" required autocomplete="off" />
    <input id="p" name="password" type="password" placeholder="Пароль" required autocomplete="off" />
    <button type="submit" id="login">Войти</button>
  </form>
  <button id="reg" type="button">Создать аккаунт</button>
  <div id="err"></div>
</div>

<div id="app" class="hidden">
  <input type="file" id="avatarInput" accept="image/*" class="hidden" />
  <input type="file" id="customStickerInput" accept="image/*" class="hidden" />

  <aside>
    <header>
      <div class="user-profile" id="myProfileBtn">
        <div class="avatar" id="me-avatar">?</div>
        <div class="user-info">
          <b id="me">...</b>
          <span>в сети</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="addBtn" title="Добавить контакт">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="22" y1="11" x2="16" y2="11"></line></svg>
        </button>
        <button id="createGroupBtn" title="Создать группу">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </button>
        <button id="settingsBtn" title="Настройки">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
      </div>
    </header>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="new-password" />
    </div>

    <div class="users-container">
      <div class="list-header">Каналы и Группы</div>
      <ul id="groups-list"></ul>
      
      <div class="list-header">Личные сообщения</div>
      <ul id="users-list"></ul>
    </div>
  </aside>

  <main>
    <div id="empty-chat">
      <h2>Выберите чат</h2>
      <p>Откройте контакт или группу слева.</p>
    </div>

    <div id="chat-view" class="hidden" style="display:flex; flex-direction:column; height:100%;">
      <header>
        <button class="icon-btn close-chat-btn" id="closeChatBtn" title="Закрыть чат">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <div class="chat-info" style="flex: 1;">
          <div class="avatar" id="chat-avatar">?</div>
          <div>
            <div class="title" id="chatTitle">...</div>
          </div>
        </div>
        <div class="call-actions">
          <button id="startCallBtn" title="Позвонить">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </button>
        </div>
      </header>
      <div id="messages"></div>
      
      <form id="form" class="hidden">
        <button type="button" id="stickerBtn" class="icon-btn">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
        </button>
        <input id="input" autocomplete="off" placeholder="Сообщение..." />
        <button type="submit">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
        <div id="sticker-panel" class="hidden"></div>
      </form>
    </div>
  </main>
</div>

<div id="add-contact-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Добавить контакт</h2>
    <input type="text" id="contactUsername" placeholder="Введите логин пользователя" />
    <button id="submitAddContact">Добавить</button>
    <button id="cancelAddContact" class="cancel">Отмена</button>
  </div>
</div>

<div id="create-group-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Создать группу</h2>
    <input type="text" id="groupName" placeholder="Название" />
    <select id="groupType">
      <option value="group">Группа (все пишут)</option>
      <option value="channel">Канал (только админ)</option>
    </select>
    <button id="submitCreateGroup">Создать</button>
    <button id="cancelCreateGroup" class="cancel">Отмена</button>
  </div>
</div>

<div id="settings-modal" class="modal hidden">
  <div class="modal-content">
    <h2>Настройки</h2>
    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="tab-profile">Профиль</button>
      <button class="settings-tab" data-tab="tab-security">Безопасность</button>
    </div>
    <div id="tab-profile" class="tab-content active">
      <div class="setting-item"><label>Аватарка</label><button class="settings-btn" id="changeAvatarBtn">Изменить</button></div>
      <div class="setting-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <label>Цветовая тема</label>
        <select id="themeSelect" style="width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); outline: none; cursor: pointer; font-family: inherit; font-size: 15px;">
          <option value="default">Чёрная</option><option value="blue">Синяя</option><option value="red">Красная</option><option value="gray">Серая</option><option value="pink">Розовая</option><option value="sunset">🌅 Закат</option><option value="ocean">🌊 Океан</option><option value="dracula">🧛 Дракула</option><option value="cyberpunk">🤖 Киберпанк</option><option value="coffee">☕ Кофе</option><option value="deepseek">🌟 DeepSeek</option>
        </select>
      </div>
      <button class="settings-btn" id="logoutBtn" style="width: 100%; margin-top: 10px; background: rgba(239,68,68,0.2); color: #ef4444;">Выйти</button>
    </div>
    <div id="tab-security" class="tab-content">
      <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 12px; border-radius: 8px; margin-bottom: 20px;">
        <p style="font-size: 13px; color: var(--success); line-height: 1.4;"><b>🛡️ E2EE Включено.</b> Сервер не видит ваши сообщения.</p>
      </div>
      <h3 style="font-size: 16px; margin-bottom: 12px;">Смена пароля</h3>
      <div class="form-group"><input type="password" id="oldPassword" placeholder="Текущий пароль" /></div>
      <div class="form-group"><input type="password" id="newPassword" placeholder="Новый пароль" /></div>
      <button class="btn-save" id="changePasswordBtn">Сменить</button>
    </div>
    <button class="settings-btn" id="closeSettingsBtn" style="width: 100%; margin-top: 20px; background: var(--accent); color: white;">Закрыть</button>
  </div>
</div>

<div id="call-overlay" class="hidden">
  <div id="video-grid"></div>
  <div id="call-controls-bar">
    <button class="btn-hangup" id="hangupBtn">Завершить</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem('pm_token');
let me = null; try { me = JSON.parse(localStorage.getItem('pm_user') || 'null'); } catch {}
let socket = null, currentChat = null;
let contacts = [], groups = [], onlineSet = new Set(), myKeys = null;

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

async function generateKeys() {
  const keyPair = await window.crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);
  const exportedPub = await window.crypto.subtle.exportKey("jwk", keyPair.publicKey);
  const exportedPriv = await window.crypto.subtle.exportKey("jwk", keyPair.privateKey);
  localStorage.setItem('pm_priv_key', JSON.stringify(exportedPriv));
  await fetch('/api/public-key', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ publicKey: JSON.stringify(exportedPub) }) });
  myKeys = { privateKey: keyPair.privateKey };
}
async function loadKeys() {
  const privStr = localStorage.getItem('pm_priv_key'); if (!privStr) return false;
  try { myKeys = { privateKey: await window.crypto.subtle.importKey("jwk", JSON.parse(privStr), { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]) }; return true; } catch (e) { return false; }
}
async function encryptMsg(text, pubKeyJwk) {
  const pubKey = await window.crypto.subtle.importKey("jwk", JSON.parse(pubKeyJwk), { name: "ECDH", namedCurve: "P-256" }, true, []);
  const sharedKey = await window.crypto.subtle.deriveKey({ name: "ECDH", public: pubKey }, myKeys.privateKey, { name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const ct = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedKey, new TextEncoder().encode(text));
  return { ciphertext: btoa(String.fromCharCode(...new Uint8Array(ct))), iv: btoa(String.fromCharCode(...iv)) };
}
async function decryptMsg(ctB64, ivB64, pubKeyJwk) {
  try {
    const pubKey = await window.crypto.subtle.importKey("jwk", JSON.parse(pubKeyJwk), { name: "ECDH", namedCurve: "P-256" }, true, []);
    const sharedKey = await window.crypto.subtle.deriveKey({ name: "ECDH", public: pubKey }, myKeys.privateKey, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    const pt = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: Uint8Array.from(atob(ivB64), c=>c.charCodeAt(0)) }, sharedKey, Uint8Array.from(atob(ctB64), c=>c.charCodeAt(0)));
    return new TextDecoder().decode(pt);
  } catch { return "🔒 [Зашифровано]"; }
}

async function api(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error); return j;
}

$('auth-form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const { token: t, user } = await api('/api/login', { username: $('u').value, password: $('p').value });
    token = t; me = user; localStorage.setItem('pm_token', t); localStorage.setItem('pm_user', JSON.stringify(user)); start();
  } catch (e) { $('err').textContent = e.message; }
};
$('reg').onclick = async () => {
  try {
    const { token: t, user } = await api('/api/register', { username: $('u').value, password: $('p').value });
    token = t; me = user; localStorage.setItem('pm_token', t); localStorage.setItem('pm_user', JSON.stringify(user)); start();
  } catch (e) { $('err').textContent = e.message; }
};

async function start() {
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('me').textContent = me.username;
  if (!(await loadKeys())) await generateKeys();
  $('searchInput').value = ''; 

  socket = io({ auth: { token } });
  
  socket.on('connect', () => socket.emit('get-data', data => { contacts = data.contacts; groups = data.groups; renderLists(); }));
  socket.on('refresh-data', () => socket.emit('get-data', data => { contacts = data.contacts; groups = data.groups; renderLists(); }));
  socket.on('online', ids => { onlineSet = new Set(ids); renderLists(); });
  
  socket.on('message', async m => {
    if (currentChat && (m.groupId === currentChat.id || m.toId === currentChat.id || m.fromId === currentChat.id)) {
      await renderMessage(m);
    }
  });

  socket.on('call-peers', ({ peers }) => { peers.forEach(pid => createPeerConnection(pid, true)); });
  socket.on('peer-joined', ({ peerId }) => { createPeerConnection(peerId, false); });
  socket.on('call-signal', async ({ fromId, signal }) => {
    if (!peers[fromId]) createPeerConnection(fromId, false);
    if (signal.sdp) await peers[fromId].setRemoteDescription(new RTCSessionDescription(signal.sdp));
    else if (signal.ice) await peers[fromId].addIceCandidate(new RTCIceCandidate(signal.ice));
  });
  socket.on('peer-left', ({ peerId }) => { if (peers[peerId]) { peers[peerId].close(); delete peers[peerId]; $(`wrapper-${peerId}`)?.remove(); } });

  const currentTheme = localStorage.getItem('pm_theme') || 'default';
  document.body.className = currentTheme === 'default' ? '' : `theme-${currentTheme}`;
}

function renderLists() {
  $('groups-list').innerHTML = '';
  $('users-list').innerHTML = '';
  const query = $('searchInput').value.toLowerCase();

  groups.filter(g => g.name.toLowerCase().includes(query)).forEach(g => {
    const li = document.createElement('li');
    li.className = currentChat?.id === g.id ? 'active' : '';
    li.innerHTML = `<div class="contact-left"><div class="avatar">${g.type === 'channel' ? '📢' : '👥'}</div><span>${g.name}</span></div>`;
    li.onclick = () => openChat('group', g);
    $('groups-list').appendChild(li);
  });

  contacts.filter(c => c.username.toLowerCase().includes(query)).forEach(c => {
    const li = document.createElement('li');
    li.className = currentChat?.id === c.id ? 'active' : '';
    li.innerHTML = `
      <div class="contact-left">
        <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : c.username[0].toUpperCase()}</div>
        <span>${c.username}</span>
      </div>
      <span class="dot ${onlineSet.has(c.id) ? 'on' : ''}"></span>`;
    li.onclick = () => openChat('user', c);
    $('users-list').appendChild(li);
  });
}
$('searchInput').oninput = renderLists;

function openChat(type, data) {
  currentChat = { type, id: data.id, name: type === 'group' ? data.name : data.username, avatar: data.avatar, members: data.members };
  $('app').classList.add('chat-open');
  $('empty-chat').classList.add('hidden');
  $('chat-view').classList.remove('hidden');
  $('form').classList.remove('hidden');
  $('chatTitle').textContent = currentChat.name;
  $('chat-avatar').innerHTML = currentChat.avatar ? `<img src="${currentChat.avatar}">` : (type === 'group' ? (data.type === 'channel' ? '📢' : '👥') : currentChat.name[0]);
  $('messages').innerHTML = '';
  renderLists();
  
  socket.emit('history', { withId: currentChat.id, isGroup: type === 'group' }, async rows => {
    for (const m of rows) await renderMessage(m);
  });
}

$('closeChatBtn').onclick = () => {
  $('app').classList.remove('chat-open');
  currentChat = null;
  $('chat-view').classList.add('hidden');
  $('empty-chat').classList.remove('hidden');
  renderLists();
};

async function renderMessage(m) {
  const d = document.createElement('div');
  d.className = 'msg' + (m.fromId === me.id ? ' me' : '');
  
  if (m.fromId !== me.id && currentChat?.type === 'group') {
    const sender = contacts.find(c => c.id === m.fromId);
    d.innerHTML += `<span class="sender-name">${sender ? sender.username : 'Участник'}</span>`;
  }

  let text = m.body;
  if (m.iv) {
    if (currentChat?.type === 'group') text = "🔒 [Зашифровано]";
    else {
      const other = contacts.find(c => c.id === (m.fromId === me.id ? m.toId : m.fromId));
      text = other?.publicKey ? await decryptMsg(m.body, m.iv, other.publicKey) : "🔒 [Нет ключа]";
    }
  }

  d.innerHTML += `${escapeHtml(text)}<span class="t">${new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
  $('messages').appendChild(d);
  $('messages').scrollTop = $('messages').scrollHeight;
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('input').value.trim(); if (!text || !currentChat) return;
  
  let body = text, iv = null;
  if (currentChat.type === 'user') {
    const other = contacts.find(c => c.id === currentChat.id);
    if (other?.publicKey) {
      const enc = await encryptMsg(text, other.publicKey); body = enc.ciphertext; iv = enc.iv;
    }
  }

  socket.emit('message', { groupId: currentChat.type === 'group' ? currentChat.id : null, toId: currentChat.type === 'user' ? currentChat.id : null, body, iv, type: 'text' }, async res => {
    if (res.error) alert(res.error); else await renderMessage(res.msg);
  });
  $('input').value = '';
};

$('settingsBtn').onclick = () => $('settings-modal').classList.remove('hidden');
$('closeSettingsBtn').onclick = () => $('settings-modal').classList.add('hidden');
$('myProfileBtn').onclick = () => $('settings-modal').classList.remove('hidden');
$('logoutBtn').onclick = () => { localStorage.clear(); location.reload(); };

$('addBtn').onclick = () => $('add-contact-modal').classList.remove('hidden');
$('cancelAddContact').onclick = () => $('add-contact-modal').classList.add('hidden');
$('submitAddContact').onclick = () => {
  const u = $('contactUsername').value.trim(); if (!u) return;
  socket.emit('add-contact', { username: u }, res => {
    if (res.error) alert(res.error); else { $('add-contact-modal').classList.add('hidden'); $('contactUsername').value = ''; }
  });
};

$('createGroupBtn').onclick = () => $('create-group-modal').classList.remove('hidden');
$('cancelCreateGroup').onclick = () => $('create-group-modal').classList.add('hidden');
$('submitCreateGroup').onclick = () => {
  const name = $('groupName').value.trim(); if (!name) return alert('Введите название');
  socket.emit('create-group', { name, type: $('groupType').value, memberIds: [] }, res => {
    if (res.error) alert(res.error); else { $('create-group-modal').classList.add('hidden'); $('groupName').value = ''; }
  });
};

document.querySelectorAll('.settings-tab').forEach(tab => { tab.onclick = () => { document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active')); tab.classList.add('active'); $(tab.dataset.tab).classList.add('active'); }; });
const currentTheme = localStorage.getItem('pm_theme') || 'default';
setTimeout(() => { if ($('themeSelect')) $('themeSelect').value = currentTheme; }, 100);
if ($('themeSelect')) $('themeSelect').onchange = (e) => { const theme = e.target.value; document.body.className = theme === 'default' ? '' : `theme-${theme}`; localStorage.setItem('pm_theme', theme); };

$('changePasswordBtn').onclick = async () => {
  const oldP = $('oldPassword').value, newP = $('newPassword').value;
  if (!oldP || newP.length < 6) return alert('Пароль мин. 6 символов');
  try {
    const res = await fetch('/api/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ oldPassword: oldP, newPassword: newP }) });
    const data = await res.json();
    if (res.ok) { alert('Пароль изменен!'); $('oldPassword').value = ''; $('newPassword').value = ''; } 
    else if (res.status === 401 || res.status === 403) { alert('Сессия устарела. Войдите заново.'); localStorage.clear(); location.reload(); }
    else alert(data.error || 'Ошибка');
  } catch (e) { alert('Сетевая ошибка: ' + e.message); }
};

let peers = {}, localStream = null, inCall = false;
$('startCallBtn').onclick = async () => {
  if (!currentChat) return alert('Выберите чат');
  if (inCall) return alert('Вы уже в звонке');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    $('call-overlay').classList.remove('hidden'); inCall = true;
    addVideoElement('me', 'Вы', localStream);
    socket.emit('join-call', { groupId: currentChat.id });
  } catch (e) { alert('Нет доступа к камере/микрофону'); }
};

async function createPeerConnection(peerId, isInitiator) {
  if (peers[peerId]) return;
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  peers[peerId] = pc;
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.onicecandidate = (e) => { if (e.candidate) socket.emit('call-signal', { toId: peerId, signal: { ice: e.candidate } }); };
  pc.ontrack = (e) => { if (!$(`wrapper-${peerId}`)) addVideoElement(peerId, 'Участник', e.streams[0]); };
  if (isInitiator) { const offer = await pc.createOffer(); await pc.setLocalDescription(offer); socket.emit('call-signal', { toId: peerId, signal: { sdp: offer } }); }
}

function addVideoElement(id, name, stream) {
  const wrapper = document.createElement('div');
  wrapper.className = 'video-wrapper'; wrapper.id = `wrapper-${id}`;
  wrapper.innerHTML = `<video id="video-${id}" autoplay playsinline ${id === 'me' ? 'muted' : ''}></video><div class="video-name">${name}</div>`;
  wrapper.querySelector('video').srcObject = stream;
  $('video-grid').appendChild(wrapper);
}

$('hangupBtn').onclick = () => {
  if (currentChat) socket.emit('leave-call', { groupId: currentChat.id });
  Object.values(peers).forEach(pc => pc.close()); peers = {};
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $('video-grid').innerHTML = ''; $('call-overlay').classList.add('hidden'); inCall = false;
};

if (token && me) start();
</script>
</body>
</html>
